name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go build ./...
      # The race detector needs a C toolchain that isn't reliably on PATH on the
      # hosted Windows runner; run it on Linux/macOS and a plain test on Windows.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -coverprofile=coverage.out ./... | tee test.log
          else
            go test -race -coverprofile=coverage.out ./... | tee test.log
          fi

      - name: Test report (per package) — ${{ runner.os }}
        if: always()
        shell: bash
        run: |
          {
            echo "## Unit test report — ${{ runner.os }}"
            echo "One line per package (ok/FAIL) plus any individual failing or skipped test, from the Test step above."
            echo '```'
            grep -E '^(ok|FAIL)[[:space:]]|^--- (FAIL|SKIP):' test.log || echo "(Test step produced no per-package result lines — it may have failed before running any tests; see its log.)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLI smoke test (every read-only command, via the real binary)
        shell: bash
        run: |
          set -euo pipefail
          go test -v -run TestCLISmoke . | tee smoke.log
          {
            echo "## CLI smoke test — ${{ runner.os }}"
            echo "Each line below is one \`vitals\` invocation exec'd against the actual compiled binary (not just its package's unit tests)."
            echo '```'
            grep -E '^\s*--- (PASS|FAIL): TestCLISmoke/' smoke.log
            echo '```'
            echo "Not covered here (destructive, network-flaky, or block-forever by design): \`clean --yes\`, \`tools --install\`, \`advice\`, \`serve\`, \`mcp\`, \`guide --web\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage floor (per package)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
          {
            echo "## Coverage: ${pct} blended (see per-package floor below)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 check_coverage.py coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_docs.py's check_site_version needs the real tag list
          # (git tag --list) to catch site/index.html referencing a
          # version that hasn't been tagged yet — the default shallow
          # checkout (fetch-depth: 1) fetches no tags at all, which
          # would make that check either false-fail on every push or
          # (worse) silently no-op. This is the exact gap that let the
          # public site go live claiming v0.5.0 before the tag existed
          # (2026-09-04) — see AGENTS.md's Release process.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: Docs consistency (links, roadmap nav, breadcrumbs)
        run: python3 check_docs.py

  e2e:
    name: e2e (${{ matrix.os }})
    # Real-browser regression tests for `vitals dashboard`, via
    # Playwright — the repo's only Node/JS toolchain, added specifically
    # for what a Go test asserting on server-rendered HTML strings can't
    # see: a client-side fetch() that never resolves, a click that does
    # nothing, a real dark-mode render, a browser console error. See
    # e2e/package.json and e2e/tests/dashboard.spec.js.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build vitals
        shell: bash
        run: go build -o vitals${{ runner.os == 'Windows' && '.exe' || '' }} .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright's Chromium (+ OS deps)
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/playwright-report/
          retention-days: 7

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Cross-compile every target
        run: ./build.sh ci

  integration:
    # Secrets are unavailable to fork PRs; only run on pushes to the repo.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Integration test — Ollama Cloud over the open API
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "OLLAMA_CLOUD_KEY not configured — skipping"
            exit 0
          fi
          go test -tags=integration -run TestIntegration -v ./internal/llm/
