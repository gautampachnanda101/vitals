name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go build ./...
      # The race detector needs a C toolchain that isn't reliably on PATH on the
      # hosted Windows runner; run it on Linux/macOS and a plain test on Windows.
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -coverprofile=coverage.out ./...
          else
            go test -race -coverprofile=coverage.out ./...
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Cross-compile every target
        run: ./build.sh ci

  integration:
    # Secrets are unavailable to fork PRs; only run on pushes to the repo.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Integration test — Ollama Cloud over the open API
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "OLLAMA_CLOUD_KEY not configured — skipping"
            exit 0
          fi
          go test -tags=integration -run TestIntegration -v ./internal/llm/
