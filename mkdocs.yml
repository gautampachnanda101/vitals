site_name: 'vitals'
site_description: 'A single static binary that names the one resource constraining your machine right now and the exact command to fix it.'
repo_url: 'https://github.com/gautampachnanda101/vitals'

docs_dir: docs
# mkdocs' own default output dir is "site/" (relative to this file, i.e.
# the repo root) — which would silently collide with and overwrite
# site/index.html, the real public product page (roadmap item 003),
# built and deployed by a completely separate pipeline
# (.github/workflows/pages.yml). Redirect TechDocs' build output
# elsewhere so `mkdocs build` can never touch that directory.
site_dir: .mkdocs-build

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Architecture: architecture/design.md
  - Roadmap:
      - Overview: roadmap/index.md
      - Releases:
          - v0.5.0: roadmap/releases/v0.5.0.md
      - Items:
          - 001 Dashboard foundation: roadmap/items/001-dashboard-foundation/index.md
          - 002 Dashboard MVP: roadmap/items/002-dashboard-mvp/index.md
          - 003 Product site: roadmap/items/003-product-site/index.md
          - 004 Native launcher: roadmap/items/004-native-launcher/index.md
          - 005 Dashboard write actions: roadmap/items/005-dashboard-write-actions/index.md
          - 006 Coverage hardening: roadmap/items/006-coverage-hardening/index.md
          - 007 Dashboard visuals & machine identity: roadmap/items/007-dashboard-visuals/index.md
          - 008 vitals heal: roadmap/items/008-heal-command/index.md
          - 009 Raw 95%+ coverage: roadmap/items/009-raw-coverage-95/index.md
          - 010 Companion tools integration: roadmap/items/010-companion-tools-integration/index.md

plugins:
  - techdocs-core
